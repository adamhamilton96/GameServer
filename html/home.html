<head>
    <title>Haxxion</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.5.11/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.5.11/addons/p5.dom.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.5.11/addons/p5.sound.min.js"></script>
</head>

<body>
    <style>
        a:visited {
            color: white;
        }

        body {
            color: white;
            background-color: rgb(51, 51, 51);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 60vh;
            margin: 0;
        }

        .container {
            text-align: center;
        }
    </style>
    <script>
        let bars = [];
        let particles = [];
        let barCount;
        let counter;
        let maxLife;
        let vid;
        let shape;
        let amp;

        function preload() {
            img = new Image();
            img.src = "media/anivia.png";
            vid = createVideo("../pedro.mp4");
        }

        function setup() {
            let canvas = createCanvas(windowWidth, 300);
            canvas.elt.id = "myCanvas";
            canvas.parent('p5canvas');
            frameRate(24);
            colorMode(HSB);
            barCount = 63;
            maxLife = 350; //400 speed 7
            counter = 0;
            translate(width / 2, height / 2)
            for (let i = 0; i < barCount; i++) {
                let angle = map(i, 0, barCount - 1, 0, TWO_PI);
                let x = cos(angle) * 100;
                let y = sin(angle) * 100;

                bars.push({
                    x: x,
                    y: y,
                    angle: angle,
                    length: random(0, 25),
                });
            }
            shape = createGraphics(width, height);
            vid.size(640, 360);
            vid.volume(0.2);
            vid.play();
            vid.position(0, 0);
            vid.loop();
            vid.hide();

            amp = new p5.Amplitude();
            amp.setInput(vid);
        }

        function draw() {
            counter++;
            translate(width / 2, height / 2)
            background(0);
            let vidImg = vid.get();
            push();
            scale(0.72);
            image(vidImg, -vidImg.width / 2, -vidImg.height / 2);
            pop();

            for (let i = 0; i < bars.length; i++) {
                let bar = bars[i];
                let endX = bar.x + cos(bar.angle) * bar.length;
                let endY = bar.y + sin(bar.angle) * bar.length;

                //Draw bar
                stroke((i * 10 + counter) % 360, 255, 255);
                strokeWeight(8);
                if (bar.length > 1) {
                    line(bar.x, bar.y, endX, endY);
                }

                // Emit particle
                if (bar.length >= 45) { //82 70
                    particles.push({
                        x: endX,
                        y: endY,
                        vx: 1,
                        vy: 1,
                        barIndex: i,
                        color: color((i * 10 + counter) % 360, 255, 255),
                        //color: color(0, 0, 100),
                        lifespan: maxLife,
                        velocity: bar.length / 30, //40
                        // lifespan: maxLife * (bar.length / 50),
                        offset: random(-0.3, 0.3),
                        size: 7, //4
                        //size: int(8 + audio[int(random(0, 128))] * 4)
                    });
                }
            }

            // Draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                let bar = bars[p.barIndex];
                let speed = map(p.lifespan, 0, maxLife, 0.25, p.velocity) * 1.25;
                p.vx = (cos(bar.angle) + p.offset) * speed;
                p.vy = (sin(bar.angle) + p.offset) * speed;
                p.x += p.vx;
                p.y += p.vy;

                p.lifespan--;
                // p.color.setAlpha(map(p.lifespan, 0, maxLife, 0, 1));
                stroke(p.color);
                strokeWeight(map(p.lifespan, 0, maxLife, 0.75, p.size));
                point(p.x, p.y);
                if (p.lifespan <= 0) {
                    particles.splice(i, 1);
                }

            }
            let vol = amp.getLevel();
            for (let i = 0; i < bars.length; i++) {
                bars[i].length = amp.getLevel() * random(0.1, 2.5) * 360;
            }

        }

        function windowResized() {
            resizeCanvas(windowWidth, 300);
            bars = [];
            translate(width / 2, height / 2)
            for (let i = 0; i < barCount; i++) {
                let angle = map(i, 0, barCount - 1, 0, TWO_PI);
                let x = cos(angle) * 100;
                let y = sin(angle) * 100;

                bars.push({
                    x: x,
                    y: y,
                    angle: angle,
                    length: random(0, 25),
                });
            }
        }
    </script>
    <div id="p5canvas"></div>
    <div>
        <h1 style="text-align: center;">Haxxion</h1>

</body>
