<head>
    <title>Haxxion</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.5.11/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.5.11/addons/p5.dom.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.5.11/addons/p5.sound.min.js"></script>
</head>

<body>
    <style>
        a:visited {
            color: white;
        }

        body {
            color: white;
            background-color: rgb(51, 51, 51);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 60vh;
            margin: 0;
            max-width: 100%;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
        }

        .game-grid-CA {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .game-grid-SP {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .game-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: inherit;
        }

        .game-image {
            width: 150px;
            height: 100px;
            object-fit: fill;
            border: 1px solid #ccc;
            margin-bottom: 5px;
        }

        .game-cat {
            text-align: center;
            font-weight: bold;
        }
    </style>
    <script>
        let bars = [];
        let particles = [];
        let barCount;
        let counter;
        let maxLife;
        let vid;
        let amp;
        let isMuted = true;
        let slider;

        function preload() {
            vid = createVideo("../media/pedro.mp4");
            vid.volume(0);
            vid.size(640, 360);
            vid.position(0, 0);
            vid.loop();
            vid.hide();

            amp = new p5.Amplitude();
            amp.setInput(vid);
        }
        function setup() {
            let canvas = createCanvas(windowWidth, 300);
            canvas.elt.id = "myCanvas";
            canvas.parent('p5canvas');
            frameRate(24);
            colorMode(HSB);
            barCount = 63;
            maxLife = 350; //400 speed 7
            counter = 0;
            translate(width / 2, height / 2)
            for (let i = 0; i < barCount; i++) {
                let angle = map(i, 0, barCount - 1, 0, TWO_PI);
                let x = cos(angle) * 100;
                let y = sin(angle) * 100;

                bars.push({
                    x: x,
                    y: y,
                    angle: angle,
                    length: random(0, 25),
                });
            }

            translate(0, 0);
            button = createButton("Unmute");
            button.mouseClicked(muteButton);
            button.size(100, 20);
            button.position(width - 100, 20);

            slider = createSlider(0, 1, 0.2, 0.1);
            slider.position(width - 100, 10);
            slider.style('transform', 'rotate(270deg)');
            slider.style('height', '300px');
            slider.input(sliderUpdated);
        }

        function draw() {
            counter++;
            translate(width / 2, height / 2)
            background(0);
            let vidImg = vid.get();
            push();
            scale(0.72);
            image(vidImg, -vidImg.width / 2, -vidImg.height / 2);
            pop();

            for (let i = 0; i < bars.length; i++) {
                let bar = bars[i];
                let endX = bar.x + cos(bar.angle) * bar.length;
                let endY = bar.y + sin(bar.angle) * bar.length;

                //Draw bar
                stroke((i * 10 + counter) % 360, 255, 255);
                strokeWeight(8);
                if (bar.length > 1) {
                    line(bar.x, bar.y, endX, endY);
                }

                // Emit particle
                if (bar.length >= 45) { //82 70
                    particles.push({
                        x: endX,
                        y: endY,
                        vx: 1,
                        vy: 1,
                        barIndex: i,
                        color: color((i * 10 + counter) % 360, 255, 255),
                        //color: color(0, 0, 100),
                        lifespan: maxLife,
                        velocity: bar.length / 30, //40
                        // lifespan: maxLife * (bar.length / 50),
                        offset: random(-0.3, 0.3),
                        size: 7, //4
                        //size: int(8 + audio[int(random(0, 128))] * 4)
                    });
                }
            }

            // Draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                let bar = bars[p.barIndex];
                let speed = map(p.lifespan, 0, maxLife, 0.25, p.velocity) * 1.25;
                p.vx = (cos(bar.angle) + p.offset) * speed;
                p.vy = (sin(bar.angle) + p.offset) * speed;
                p.x += p.vx;
                p.y += p.vy;

                p.lifespan--;
                // p.color.setAlpha(map(p.lifespan, 0, maxLife, 0, 1));
                stroke(p.color);
                strokeWeight(map(p.lifespan, 0, maxLife, 0.75, p.size));
                point(p.x, p.y);
                if (p.lifespan <= 0) {
                    particles.splice(i, 1);
                }

            }
            let vol = amp.getLevel();
            for (let i = 0; i < bars.length; i++) {
                bars[i].length = amp.getLevel() * random(0.1, 2.5) * 360;
            }

        }

        function windowResized() {
            resizeCanvas(windowWidth, 300);
            bars = [];
            translate(width / 2, height / 2)
            for (let i = 0; i < barCount; i++) {
                let angle = map(i, 0, barCount - 1, 0, TWO_PI);
                let x = cos(angle) * 100;
                let y = sin(angle) * 100;

                bars.push({
                    x: x,
                    y: y,
                    angle: angle,
                    length: random(0, 25),
                });
            }
            button.position(width - 100, 20);
            slider.position(width - 100, 10);
        }

        function muteButton() {
            getAudioContext().resume();
            if (isMuted === true) {
                isMuted = false;
                vid.volume(slider.value());
                buttonLabel = "Mute";
                button.html(buttonLabel);
            } else {
                isMuted = true;
                vid.volume(0);
                buttonLabel = "Unmute";
                button.html(buttonLabel);
            }
        }

        function sliderUpdated() {
            getAudioContext().resume();
            if (!isMuted) {
                vid.volume(slider.value());
            }
        }


    </script>
    <div id="p5canvas"></div>
    <div>
        <h1 style="text-align: center;">Haxxion</h1>
        <p class="game-cat">Multiplayer</p>
        <a href="/connect4/" class="game-link">
            <img src="/media/connect4.png" alt="Connect 4" class="game-image">
            <span>Connect 4</span>
        </a>

        <p class="game-cat">Single Player</p>
        <div class="game-grid-SP">
            <a href="/floatysquare/" class="game-link">
                <img src="/media/floatySquare.png" alt="FloatySquare" class="game-image">
                <span>FloatySquare</span>
            </a>
            <a href="/snake/" class="game-link">
                <img src="/media/snake.png" alt="Snake" class="game-image">
                <span>Snake</span>
            </a>
            <a href="/benn/" class="game-link">
                <img src="/media/benn.png" alt="Benn" class="game-image">
                <span>Benn</span>
            </a>
        </div>

        <p class="game-cat">Cellular Automata</p>
        <div class="game-grid-CA">
            <a href="/gameoflife/" class="game-link">
                <img src="/media/gameOfLife.png" alt="Game of Life" class="game-image">
                <span>Game of Life</span>
            </a>
            <a href="/langtonsant/" class="game-link">
                <img src="/media/langtonsAnt.png" alt="Langtons Ant" class="game-image">
                <span>Langtons Ant</span>
            </a>
            <a href="/briansbrain/" class="game-link">
                <img src="/media/briansBrain.png" alt="Brians Brain" class="game-image">
                <span>Brians Brain</span>
            </a>
            <a href="/wireworld/" class="game-link">
                <img src="/media/wireWorld.png" alt="Wire World" class="game-image">
                <span>Wire World</span>
            </a>
            <a href="/sandpiles/" class="game-link">
                <img src="/media/sandPiles.png" alt="Sandpiles" class="game-image">
                <span>Sandpiles</span>
            </a>
        </div>

        <p class="game-cat">Camera Effects</p>
        <a href="/stippling/" class="game-link">
            <img src="/media/stippling.png" alt="Camera Stippling" class="game-image">
            <span>Camera Stippling</span>
        </a>
    </div>
</body>
