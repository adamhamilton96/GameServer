<head>
    <title>Haxxion</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.5.11/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.5.11/addons/p5.dom.min.js"></script>
</head>

<body>
    <style>
        a:visited {
            color: white;
        }

        body {
            color: white;
            background-color: rgb(51, 51, 51);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 60vh;
            margin: 0;
        }

        .container {
            text-align: center;
        }
    </style>
    <script>
        let cWidth = 1200;
        let cHeight = 300;
        let bars = [];
        let particles = [];
        let barCount;
        let counter;
        let maxLife;
        let vid;

        function preload() {
            img = new Image();
            img.src = "media/anivia.png";
        }

        function setup() {
            let canvas = createCanvas(1200, 300);
            canvas.elt.id = "myCanvas";
            canvas.parent('p5canvas');
            frameRate(24);
            colorMode(HSB);
            barCount = 64;
            maxLife = 100; //400 speed 7
            counter = 0;
            for (let i = 0; i < barCount; i++) {
                let angle = map(i, 0, barCount - 1, 0, TWO_PI);
                let x = width / 2 + cos(angle) * 100;
                let y = height / 2 + sin(angle) * 100;

                bars.push({
                    x: x,
                    y: y,
                    angle: angle,
                    length: random(0, 25),
                });
            }
            vid = createVideo("media/pedro.mp4");
            vid.size(200, 200);
            vid.volume(0.3);
            vid.loop();
            vid.hide();
        }

        function draw() {
            counter++;
            background(0);
            //drawingContext.drawImage(img, width / 2 - 100, height / 2 - 100, 200, 200);
            let img = vid.get();
            image(img, width / 2 - 100, height / 2 - 100);

            for (let i = 0; i < bars.length; i++) {
                let bar = bars[i];
                let endX = bar.x + cos(bar.angle) * bar.length;
                let endY = bar.y + sin(bar.angle) * bar.length;

                //Draw bar
                stroke((i * 10 + counter) % 360, 255, 255);
                strokeWeight(8);
                if (bar.length > 1) {
                    line(bar.x, bar.y, endX, endY);
                }

                // Emit particle
                if (bar.length >= 60) { //82 70
                    particles.push({
                        x: endX,
                        y: endY,
                        vx: 1,
                        vy: 1,
                        barIndex: i,
                        color: color((i * 10 + counter) % 360, 255, 255),
                        //color: color(0, 0, 100),
                        lifespan: maxLife,
                        velocity: bar.length / 30, //40
                        // lifespan: maxLife * (bar.length / 50),
                        offset: random(-0.3, 0.3),
                        size: 7, //4
                        //size: int(8 + audio[int(random(0, 128))] * 4)
                    });
                }
            }

            // Draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                let bar = bars[p.barIndex];
                let speed = map(p.lifespan, 0, maxLife, 0.25, p.velocity) * 1.25;
                p.vx = (cos(bar.angle) + p.offset) * speed;
                p.vy = (sin(bar.angle) + p.offset) * speed;
                p.x += p.vx;
                p.y += p.vy;

                p.lifespan--;
                // p.color.setAlpha(map(p.lifespan, 0, maxLife, 0, 1));
                stroke(p.color);
                strokeWeight(map(p.lifespan, 0, maxLife, 0.75, p.size));
                point(p.x, p.y);
                //rect(p.x, p.y, p.length, 8);
                if (p.lifespan <= 0) {
                    particles.splice(i, 1);
                }

            }
            for (let i = 0; i < bars.length; i++) {
                //bars[i].length = audio[int(random(0, 128))] * 180;
                bars[i].length = random(0, 1.3) * 50;
            }

        }
    </script>
    <div id="p5canvas"></div>
    <div>
        <h1 style="text-align: center;">Haxxion</h1>

</body>
